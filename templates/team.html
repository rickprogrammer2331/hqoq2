{% extends "base.html" %}

{% block content %}
<section id="team-hero" class="page-hero">
    <div class="hero-content" data-aos="fade-up">
        <h1>فريق العمل</h1>
        <p>نخبة من الخبراء والمتخصصين في مجال الديمقراطية وحقوق الإنسان</p>
    </div>
</section>

<section id="team-members">
    <div class="container">
        <div class="team-grid">
            {% for member in team_members %}
            <div class="team-card" data-aos="fade-up" data-aos-delay="{{ loop.index * 100 }}">
                <div class="member-photo">
                    <img src="{{ url_for('static', filename='images/team/placeholder.jpg') }}" alt="{{ member.name }}">
                </div>
                <h3>{{ member.name }}</h3>
                <div class="member-position">{{ member.position }}</div>
                <p>{{ member.bio }}</p>
                <div class="member-social">
                    <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-link"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
