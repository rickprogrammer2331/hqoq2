{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:100px;max-width:800px;">
    <div class="admin-dashboard">
        <h1>{% if news %}تعديل الخبر{% else %}إنشاء خبر{% endif %}</h1>
        <form method="post">
            <div class="form-group">
                <label>العنوان</label>
                <input type="text" name="title" value="{{ news.title if news else '' }}" required />
            </div>
            <div class="form-group">
                <label>المحتوى</label>
                <textarea name="content">{{ news.content if news else '' }}</textarea>
            </div>
            <div class="form-group">
                <label>اسم ملف الصورة (اختياري)</label>
                <input type="text" name="image" value="{{ news.image if news else '' }}" />
            </div>
            <div class="form-group">
                <label><input type="checkbox" name="published" {% if news and news.published %}checked{% endif %}> نشر مباشرة</label>
            </div>
            <button class="btn btn-primary" type="submit">حفظ</button>
        </form>
    </div>
</div>
{% endblock %}
