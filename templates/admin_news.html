{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:100px;">
    <div class="admin-dashboard">
        <h1>إدارة الأخبار</h1>
        <a href="{{ url_for('admin_news_new') }}" class="btn btn-primary">نشر خبر جديد</a>
        <table style="width:100%;margin-top:20px;border-collapse:collapse;">
            <thead>
                <tr>
                    <th>العنوان</th>
                    <th>منشور</th>
                    <th>تاريخ النشر</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody>
                {% for n in news_list %}
                <tr style="border-top:1px solid #eee;">
                    <td>{{ n.title }}</td>
                    <td>{{ 'نعم' if n.published else 'لا' }}</td>
                    <td>{{ n.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="{{ url_for('admin_news_edit', n_id=n.id) }}" class="btn">تعديل</a>
                        <form action="{{ url_for('admin_news_delete', n_id=n.id) }}" method="post" style="display:inline-block;">
                            <button class="btn" type="submit">حذف</button>
                        </form>
                        <form action="{{ url_for('admin_news_send', n_id=n.id) }}" method="post" style="display:inline-block;margin-left:6px;">
                            <button class="btn" type="submit">إرسال للمشتركين</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
