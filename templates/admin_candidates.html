{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:100px;">
    <div class="admin-dashboard">
        <h1>إدارة المرشحين</h1>
        <a href="{{ url_for('admin_candidate_new') }}" class="btn btn-primary">إضافة مرشح جديد</a>
        <table style="width:100%;margin-top:20px;border-collapse:collapse;">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>المنصب</th>
                    <th>تاريخ الإنشاء</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody>
                {% for c in candidates %}
                <tr style="border-top:1px solid #eee;">
                    <td>{{ c.name }}</td>
                    <td>{{ c.position }}</td>
                    <td>{{ c.created_at.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="{{ url_for('admin_candidate_edit', c_id=c.id) }}" class="btn">تعديل</a>
                        <form action="{{ url_for('admin_candidate_delete', c_id=c.id) }}" method="post" style="display:inline-block;">
                            <button class="btn" type="submit">حذف</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
