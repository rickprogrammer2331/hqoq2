{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:100px;max-width:800px;">
    <div class="admin-dashboard">
        <h1>{% if candidate %}تعديل المرشح{% else %}إضافة مرشح{% endif %}</h1>
        <form method="post">
            <div class="form-group">
                <label>الاسم</label>
                <input type="text" name="name" value="{{ candidate.name if candidate else '' }}" required />
            </div>
            <div class="form-group">
                <label>المنصب</label>
                <input type="text" name="position" value="{{ candidate.position if candidate else '' }}" />
            </div>
            <div class="form-group">
                <label>السيرة الذاتية</label>
                <textarea name="bio">{{ candidate.bio if candidate else '' }}</textarea>
            </div>
            <div class="form-group">
                <label>اسم ملف الصورة (في static/images)</label>
                <input type="text" name="image" value="{{ candidate.image if candidate else '' }}" />
            </div>
            <button class="btn btn-primary" type="submit">حفظ</button>
        </form>
    </div>
</div>
{% endblock %}
